name: Notelings CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # E2E uses mocked API routes and sanitized fixtures; no private secrets
      # or Supabase project credentials are needed for this job.
      NEXT_PUBLIC_NOTELINGS_E2E_AUTH_BYPASS: '1'
      NEXT_PUBLIC_PRESERVE_DRAWING_BUFFER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --run

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npx playwright test --workers=1

  # Production deployment is owned by Vercel's native GitHub integration.
  # GitHub Actions remains the validation gate and does not build twice.
